name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Biome (shared root config, both apps)
        run: npx @biomejs/biome@2.4.14 check client/src server/src

  typecheck-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm install
        working-directory: server

      - name: Typecheck server
        run: npm run typecheck
        working-directory: server

  typecheck-client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm install
        working-directory: client

      - name: Typecheck client
        run: npm run typecheck
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

  # Builds the web and server images on every push so Dockerfile breakage shows up in PRs.
  # Only pushes to main publish them to GHCR, tagged sha-<commit> and latest.
  images:
    needs: [lint, typecheck-server, typecheck-client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            context: client
          - image: server
            context: server
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Deploys main's freshly pushed images: SSHes to the server, where the deploy key is locked
  # to scripts/deploy.sh, then checks /health. Skipped until the DOMAIN repo variable is set.
  # Setup: docs/self-hosting.md, "Automatic deploys from CI".
  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    # One deploy at a time; a newer push waits instead of cancelling one mid-way
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}

    steps:
      - name: Install deploy key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The forced command on the server reads the tag from this "command"
      - name: Deploy this commit's images
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DOMAIN" "sha-${GITHUB_SHA::7}"

      - name: Health check
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "https://$DOMAIN/health"
